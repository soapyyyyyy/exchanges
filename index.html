<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Exchange Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header>
      <h1>Exchange Tracker</h1>
      <div id="dateLabel" class="date"></div>
    </header>

    <section class="card">
      <div id="trackerRows"></div>
    </section>

    <section class="card">
      <label for="weightInput">Weight</label>
      <input id="weightInput" type="number" step="0.1" inputmode="decimal" placeholder="optional" />

      <label for="notesInput">Notes</label>
      <textarea id="notesInput" rows="3" placeholder="optional"></textarea>

      <button id="saveDetailsBtn" class="wide">Save weight/notes</button>
    </section>

    <nav class="tabs">
      <button id="todayBtn">Today</button>
      <button id="historyBtn">History</button>
      <button id="settingsBtn">Settings</button>
    </nav>

    <section id="historyPanel" class="card hidden">
      <h2>History</h2>
      <div id="historyList"></div>
    </section>

    <section id="settingsPanel" class="card hidden">
      <h2>Goals</h2>
      <div id="goalInputs"></div>
      <button id="saveGoalsBtn" class="wide">Save goals</button>

      <h2>Backup</h2>
      <button id="exportBtn" class="wide">Export data</button>
      <label class="fileButton">
        Import data
        <input id="importInput" type="file" accept="application/json" />
      </label>
      <button id="resetTodayBtn" class="wide danger">Reset today</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
